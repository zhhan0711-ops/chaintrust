services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chaintrust}
      POSTGRES_USER: ${POSTGRES_USER:-chaintrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaintrust_dev}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: { context: ./apps/api, dockerfile: ../../docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://chaintrust:chaintrust_dev@db:5432/chaintrust
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: { context: ./apps/web, dockerfile: ../../docker/web.Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
